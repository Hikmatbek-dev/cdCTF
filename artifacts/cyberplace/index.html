    <!--
      Apply the stored theme before the first paint.

      React sets the class in an effect, which runs after the browser has
      already painted. That was invisible while dark was both the default and
      the fallback; now that the page is light by default, someone who chose
      dark would get a full-brightness flash of the light theme on every
      navigation. Inline and synchronous is the only place this can go.
    -->
    <script>
      try {
        if (localStorage.getItem("cdctf_theme") === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) { /* storage blocked; the default is fine */ }
    </script>

    <!--
      No hardcoded canonical or hreflang here on purpose.

      "/" is a real file, so Vercel serves it from the filesystem before any
      rewrite can run — these tags cannot be generated per host the way the
      other pages' are. They used to name https://cdctf.uz, which is not
      connected: a canonical pointing at a host that answers nothing tells a
      search engine the page it just crawled does not belong here.

      Absent, a crawler treats the URL it fetched as canonical, which is right
      on every host. SeoManager (src/lib/seo.ts) then injects the real canonical
      and hreflang set at runtime from window.location.origin.

      Once cdctf.uz is connected, these can come back as static tags.
    -->

    <meta property="og:site_name" content="cdCTF" />
    <meta property="og:title" content="cdCTF — Kiberxavfsizlik akademiyasi | 6 oylik dastur" />
    <meta property="og:description" content="A hands-on, six-month cybersecurity program in Uzbek, Russian and English — real terminal commands, CTF challenges, and a certificate at the end." />
    <meta property="og:type" content="website" />
    <!-- og:url omitted: with none, a crawler uses the URL it fetched, so the
         preview links back to the host the reader actually clicked from.
         og:image is relative for the same reason — resolved against that URL,
         it always exists; the absolute one pointed at an unconnected domain and
         rendered as an empty grey box in every chat app.
         It is a purpose-built 1200×630 card now, not the 600×342 logo a link
         unfurler had to letterbox or crop. -->
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="uz_UZ" />
    <meta property="og:locale:alternate" content="ru_RU" />
    <meta property="og:locale:alternate" content="en_US" />

    <meta name="twitter:description" content="A hands-on, six-month cybersecurity program in Uzbek, Russian and English — with real commands, CTF, and a certificate." />
    <meta name="twitter:image" content="/og.png" />

    <!-- Icons, at the sizes they claim to be. The old favicon was a 2048×2048
         255 KB JPEG, and the manifest labelled it 192×192; the maskable slot
         pointed at a 600×342 non-square PNG that could never be masked. These
         are generated PNGs at their true dimensions. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Self-hosted. The stylesheet used to come from fonts.googleapis.com and
         the Content-Security-Policy has no third-party host in style-src, so the
         browser blocked it and every page rendered in the fallback system font.
         Serving it ourselves fixes that without widening the policy, and drops
         two DNS lookups and a round trip on connections that may not be fast. -->
    <link rel="preload" href="/fonts/inter-e3237528.woff2" as="font" type="font/woff2" crossorigin>
