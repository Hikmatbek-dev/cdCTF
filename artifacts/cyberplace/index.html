    <!--
      Apply the stored theme before the first paint.

      React sets the class in an effect, which runs after the browser has
      already painted. That was invisible while dark was both the default and
      the fallback; now that the page is light by default, someone who chose
      dark would get a full-brightness flash of the light theme on every
      navigation. Inline and synchronous is the only place this can go.
    -->
    <script>
      try {
        if (localStorage.getItem("cdctf_theme") === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) { /* storage blocked; the default is fine */ }
    </script>

    <!--
      No hardcoded canonical or hreflang here on purpose.

      "/" is a real file, so Vercel serves it from the filesystem before any
      rewrite can run — these tags cannot be generated per host the way the
      other pages' are. They used to name https://cdctf.uz, which is not
      connected: a canonical pointing at a host that answers nothing tells a
      search engine the page it just crawled does not belong here.

      Absent, a crawler treats the URL it fetched as canonical, which is right
      on every host. SeoManager (src/lib/seo.ts) then injects the real canonical
      and hreflang set at runtime from window.location.origin.

      Once cdctf.uz is connected, these can come back as static tags.
    -->

    <meta property="og:type" content="website" />
    <!-- og:url omitted: with none, a crawler uses the URL it fetched, so the
         preview links back to the host the reader actually clicked from.
         og:image is relative for the same reason — resolved against that URL,
         it always exists; the absolute one pointed at an unconnected domain and
         rendered as an empty grey box in every chat app.

    <meta property="og:image" content="/og.png" />

    <!-- Analytics. The CSP has allowed plausible.io — script-src and connect-src
